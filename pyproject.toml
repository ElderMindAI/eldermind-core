[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldermind-core"
version = "1.0.0"
description = "Deterministic esoteric calculation engine: Western/Vedic astrology, Human Design, Gene Keys, Matrix of Destiny, BaZi, numerology, draconic chart, Animal Design."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Eldermind" }]
keywords = ["astrology", "human-design", "gene-keys", "bazi", "swiss-ephemeris"]

dependencies = [
    "pyswisseph==2.10.3.2",
    "cnlunar==0.2.4",
    # Not pinned to an exact patch: the report backend and the API service
    # resolve it independently, and 2.9.0 vs 2.9.0.post0 is not a difference
    # worth breaking an install over.
    "python-dateutil~=2.9",
    "geopy==2.5.0",
    "timezonefinder==8.2.5",
    # Required, not optional: `zoneinfo` reads the *system* tz database, which
    # Windows does not have and slim container images usually strip. Without it
    # every timezone resolves to "unknown" and the engine rejects valid input.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["eldermind_core*"]

[tool.setuptools.package-data]
eldermind_core = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
